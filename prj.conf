CONFIG_LOG=y

CONFIG_I2C=y

CONFIG_LIS2DH=y  # Accelerometer
CONFIG_LIS2DH_TRIGGER_GLOBAL_THREAD=y
CONFIG_LIS2DH_ACCEL_HP_FILTERS=y
CONFIG_LIS2MDL=y # Magnetometer
CONFIG_GPIO=y

CONFIG_SENSOR=y

CONFIG_NEWLIB_LIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Shell for the 2D fine-tune calibration commands (cal2d ...)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Hardware FPU (Cortex-M33) for the calibration math
CONFIG_FPU=y

CONFIG_MAIN_STACK_SIZE=32768
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_LOG_MODE_IMMEDIATE=y
